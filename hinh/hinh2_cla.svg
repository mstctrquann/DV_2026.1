<text x="290.0" y="446.5" text-anchor="middle" font-size="15" font-weight="bold">Sinh g, p</text>
<text x="290.0" y="465.5" text-anchor="middle" font-size="14">g = a &amp; b</text>
<text x="290.0" y="484.5" text-anchor="middle" font-size="14">p = a ^ b</text>
<text x="290.0" y="503.5" text-anchor="middle" font-size="14">4 AND, 4 XOR</text>
<rect class="blk" x="480" y="420" width="240" height="100" rx="4" fill="#eef4fb" stroke="#1f6fb2" stroke-width="2"/>
<text x="600.0" y="456.0" text-anchor="middle" font-size="15" font-weight="bold">Logic nhìn trước</text>
<text x="600.0" y="475.0" text-anchor="middle" font-size="14">c[1..4] từ g, p, c[0]</text>
<text x="600.0" y="494.0" text-anchor="middle" font-size="14">2 mức AND–OR</text>
<rect class="blk" x="840" y="420" width="200" height="100" rx="4" fill="#eef4fb" stroke="#1f6fb2" stroke-width="2"/>
<text x="940.0" y="456.0" text-anchor="middle" font-size="15" font-weight="bold">Tổng</text>
<text x="940.0" y="475.0" text-anchor="middle" font-size="14">s = p ^ c[3:0]</text>
<text x="940.0" y="494.0" text-anchor="middle" font-size="14">4 XOR</text>
<path class="wire" d="M40 470 L180 470.0" fill="none" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<text x="110" y="458" text-anchor="middle" font-size="14">a[3:0], b[3:0]</text>
