<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="720" viewBox="0 0 1110 720" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="1110" height="720" fill="#ffffff"/>
<rect class="blk" x="390" y="80" width="260" height="80" rx="4" fill="#eef8f1" stroke="#2e8b57" stroke-width="2"/>
<text x="520.0" y="115.5" text-anchor="middle" font-size="15" font-weight="bold">Thanh ghi M, N+1 bit</text>
<text x="520.0" y="134.5" text-anchor="middle" font-size="14">nạp {a[N−1], a}</text>
