<text x="180.0" y="505.5" text-anchor="middle" font-size="15" font-weight="bold">Thanh ghi P, 2N bit</text>
<text x="180.0" y="524.5" text-anchor="middle" font-size="14">{A[N−1:0], Q} cuối</text>
